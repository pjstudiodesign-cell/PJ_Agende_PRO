<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJ Agende PRO - Gestão Especializada</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #121212; --accent: #d4af37; --text: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: #1a1a1a; color: var(--text); margin: 0; }
        header { background: var(--primary); padding: 30px; text-align: center; border-bottom: 3px solid var(--accent); }
        .container { max-width: 900px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #252525; border-radius: 12px; padding: 20px; border: 1px solid #333; transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .price { color: var(--accent); font-size: 1.5rem; font-weight: bold; margin: 15px 0; }
        .btn { background: var(--accent); color: #000; padding: 12px; border-radius: 8px; text-decoration: none; display: block; text-align: center; font-weight: bold; }
        .footer { text-align: center; margin-top: 50px; color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <h1 style="color: var(--accent); margin: 0;">PJ AGENDE PRO</h1>
        <p>Sua agenda profissional em um clique</p>
    </header>
    <div class="container">
        <div class="grid">
            {% for item in produtos %}
            <div class="card">
                <h2 style="margin: 0;">{{ item.nome }}</h2>
                <p style="color: #aaa;">{{ item.categoria }}</p>
                <div class="price">R$ {{ "%.2f"|format(item.preco) }}</div>
                <a href="https://wa.me/5500000000000" class="btn">AGENDAR AGORA</a>
            </div>
            {% else %}
            <p style="grid-column: 1/-1; text-align: center;">Aguardando carregamento do banco de dados...</p>
            {% endfor %}
        </div>
        <div class="footer">
            Desenvolvido por PJ Studio Design &copy; 2026
        </div>
    </div>
</body>
</html>
