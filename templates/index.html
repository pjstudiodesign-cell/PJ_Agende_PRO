<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PJ Agende Pro</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root{
            --primary:#0d0d0d;
            --purple-dark:#1a0a2e;
            --purple-light:#6b3fa0;
            --accent:#d4af37;
            --text:#ffffff;
            --danger:#ff4d4d;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Montserrat', sans-serif;
            background:linear-gradient(135deg,#0d0d0d 0%, #1a0a2e 50%, #0d0d0d 100%);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            color:var(--text);
        }

        .login-box{
            width:100%;
            max-width:420px;
            background:linear-gradient(145deg,#1a1025,#0f0820);
            border:2px solid var(--accent);
            border-radius:20px;
            padding:35px;
            box-shadow:0 20px 50px rgba(0,0,0,.5);
        }

        h1{
            text-align:center;
            color:var(--accent);
            font-size:2rem;
            margin-bottom:30px;
            font-weight:900;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:.85rem;
            color:var(--accent);
            font-weight:700;
            letter-spacing:2px;
            text-transform:uppercase;
        }

        input{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            margin-bottom:20px;
            font-size:1rem;
            background:rgba(255,255,255,.08);
            color:white;
            font-family:'Montserrat', sans-serif;
        }

        input:focus{
            outline:none;
            border:1px solid var(--accent);
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            cursor:pointer;
            font-size:1rem;
            font-weight:900;
            font-family:'Montserrat', sans-serif;
            background:linear-gradient(135deg,var(--purple-light),var(--accent));
            color:black;
            letter-spacing:2px;
            transition:.3s;
        }

        button:hover{
            transform:translateY(-2px);
        }

        .erro{
            background:rgba(255,0,0,.1);
            border:1px solid rgba(255,0,0,.4);
            color:#ff6b6b;
            padding:12px;
            border-radius:10px;
            margin-bottom:20px;
            text-align:center;
            font-size:.9rem;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>PAINEL ADMIN</h1>

    {% if erro %}
        <div class="erro">
            {{ erro }}
        </div>
    {% endif %}

    <form method="POST">
        <label>Usuário</label>
        <input type="text" name="usuario" required>

        <label>Senha</label>
        <input type="password" name="senha" required>

        <button type="submit">
            ENTRAR
        </button>
    </form>
</div>

</body>
</html>
