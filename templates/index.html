<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJ Agende PRO - Sistema de Gestão</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #121212; --accent: #d4af37; --card-bg: #252525; --text: #ffffff; --success: #25d366; }
        body { font-family: 'Inter', sans-serif; background: #1a1a1a; color: var(--text); margin: 0; padding-bottom: 100px; }
        header { background: var(--primary); padding: 30px; text-align: center; border-bottom: 3px solid var(--accent); }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        
        /* Grid e Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #333; transition: 0.3s; }
        .card:hover { border-color: var(--accent); }
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #333; }
        .card-content { padding: 20px; }
        .price { color: var(--accent); font-size: 1.5rem; font-weight: bold; margin: 10px 0; }
        
        /* Botões */
        .btn-select { background: var(--accent); color: black; padding: 12px; border-radius: 8px; border: none; width: 100%; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-select.active { background: #ff4444; color: white; }

        /* Barra de Finalização */
        .booking-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); padding: 20px; border-top: 2px solid var(--accent); display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
        .btn-confirm { background: var(--success); color: white; padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

<header>
    <h1 style="color: var(--accent); margin: 0;">PJ AGENDE PRO</h1>
    <p style="opacity: 0.8;">Especialista em Automação - PJ Studio Design</p>
</header>

<div class="container">
    <div class="grid">
        {% for item in produtos %}
        <div class="card">
            <img src="{{ item.imagem_url if item.imagem_url else 'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=500' }}" class="card-img" alt="{{ item.nome }}">
            <div class="card-content">
                <h2 style="margin: 0; font-size: 1.3rem;">{{ item.nome }}</h2>
                <p style="color: #888; margin: 5px 0;">{{ item.categoria }}</p>
                <div class="price">R$ {{ "%.2f"|format(item.preco) }}</div>
                <button class="btn-select" onclick="gerenciarSelecao(this, '{{ item.nome }}', {{ item.preco }})">SELECIONAR</button>
            </div>
        </div>
        {% else %}
        <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
            <p>Conectando ao banco de dados Supabase...</p>
        </div>
        {% endfor %}
    </div>
</div>

<div class="booking-bar">
    <div>Total: <span id="total-display" style="color: var(--accent); font-size: 1.4rem; font-weight: bold;">R$ 0.00</span></div>
    <a href="#" class="btn-confirm" onclick="finalizarAgendamento()">
        <i class="fab fa-whatsapp"></i> FINALIZAR
    </a>
</div>

<script>
    let carrinho = [];
    let valorTotal = 0;

    function gerenciarSelecao(btn, nome, preco) {
        if (!carrinho.includes(nome)) {
            carrinho.push(nome);
            valorTotal += preco;
            btn.innerText = "REMOVER";
            btn.classList.add('active');
        } else {
            carrinho = carrinho.filter(i => i !== nome);
            valorTotal -= preco;
            btn.innerText = "SELECIONAR";
            btn.classList.remove('active');
        }
        document.getElementById('total-display').innerText = `R$ ${valorTotal.toFixed(2)}`;
    }

    function finalizarAgendamento() {
        if (carrinho.length === 0) return alert("Selecione ao menos um serviço!");
        const texto = `Olá! Gostaria de agendar: ${carrinho.join(', ')}. Total: R$ ${valorTotal.toFixed(2)}`;
        window.open(`https://wa.me/5500000000000?text=${encodeURIComponent(texto)}`, '_blank');
    }
</script>

</body>
</html>
